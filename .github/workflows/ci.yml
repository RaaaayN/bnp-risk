name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt -e .
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -v
      - name: Reproduce training metrics and README
        run: |
          cp models/metrics.json /tmp/expected-metrics.json
          python src/riskops/data_gen.py
          python src/riskops/features.py
          python src/riskops/train.py
          python scripts/compare_metrics.py /tmp/expected-metrics.json models/metrics.json
          python scripts/render_readme_metrics.py
          git diff --exit-code -- README.md
